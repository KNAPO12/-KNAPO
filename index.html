async function myMem(q,src="en",dst="ru"){

}

  const SEP=[/\t/,/\s*;\s*/,/\s+[—–-]+\s+|\s*[—–]\s*/,/\s*\|\s*/,/\s*=\s*/,/:\s+/,/\s*,\s*/,/$/];
  txt.replace(/^\uFEFF/,"").split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim().replace(/^\d+[.)]\s+/,"").replace(/^[•*]\s+/,"");
    if(!l)return;
    let a,b;const q=l.match(/^"([^"]*)"\s*[,;]\s*"?([^"]*?)"?$/);
    if(q){a=q[1].trim();b=q[2].trim()}
    else{const s=SEP.map(r=>l.match(r)).find(Boolean);a=l.slice(0,s.index).trim();b=l.slice(s.index+s[0].length).trim()}
    if(!a||(!b&&l.length>60)){bad.push([i+1,raw,"не распознано"]);return}
    if(!ok.length&&!seen.size&&/^(word|term|слово|english|original|en)$/i.test(a)){seen.add("#h");return}
    const k=a.toLowerCase();
    if(seen.has(k)){bad.push([i+1,raw,"дубликат"]);return}
    seen.add(k);ok.push([a,b]);
  });
  return{ok,bad};
}

    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).map(r=>[r[0]??"",r[1]??""].join("\t")).join("\n")}
  if(/\.docx$/.test(n)){const h=(await mammoth.convertToHtml({arrayBuffer:buf})).value,d=new DOMParser().parseFromString(h,"text/html");

}

done:()=>{const c=T.key&&T.key.c&&S.courses.find(x=>x.id==T.key.c);return`<div class="empty">${ic(V.pass?"star":"refresh",48)}<h2>${V.sc}%</h2><p>${V.pass?"Тренировка пройдена!":"Нужно не меньше 80%. Попробуйте ещё раз."}</p><p class="mu">+${T.xp} ⭐ (выучено новых: ${T.newW||0} · повторено: ${T.repW||0}) · серия ${S.streak} дн.</p><p class="mu">Освоение слов: ${pct(T.words)}% · всего выучено: ${learnedCnt("all")} сл.${c?` · курс ${prog(c)}%`:""}</p><p class="mu">Цель дня: ${Math.min(todayXp(),goal())} / ${goal()} слов${T.goalHit?" · выполнена 🎉":""}</p></div><button class="btn" data-a="${c?"course":"home"}" data-id="${c?c.id:""}">Продолжить</button>`}
};
let lastKey="";
function R(){
  const y=scrollY,key=V.v+(V.id||"")+(V.topic||"")+(V.sc||"")+(S.tab||"")+(V.v=="run"?T.i:"");
  if(V.v=="run"&&T&&!T.q[T.i])return finish(),R();
  let body;try{body=views[V.v]()}catch(e){console.error(e);body=`<div class="empty">${ic("alert",44)}<p>Что-то пошло не так. Прогресс сохранён.</p><p class="mu">${esc(e.message)}</p></div><button class="btn" data-a="home">На главную</button>`}
  $("#app").innerHTML=head()+`<main class="${["home","chat","course","lesson"].includes(V.v)?"pb":""}">`+body+"</main>"+(V.v=="home"?tabs():"");
  if(V.v=="run"){const w=T.q[T.i];if(w&&!hasEx(w)&&!V.ld)setTimeout(()=>ld(w))}
  const t=$("#ty");if(t&&!t.disabled)t.focus({preventScroll:true});
  $("#pop").className="";
  if(V.v=="chat")scrollTo(0,document.body.scrollHeight);else scrollTo(0,key==lastKey?y:0);
  lastKey=key;
}
function act(a,d,el){
  switch(a){
  case"home":V={v:"home"};T=0;break;
  case"theme":S.theme=S.theme==""?"dark":S.theme=="dark"?"light":"";save();th();break;
  case"tab":S.tab=d.k;save();break;
  case"import":V={v:"import"};break;
  case"sample":$("#paste").value=EX;return;
  case"parse":{const t=$("#paste").value;if(!t.trim())return toast("Вставьте список или выберите файл");return go(t,"Мой курс")}
  case"swap":V.pairs=V.pairs.map(p=>[p[1],p[0]]);break;
  case"del":V.pairs.splice(+d.i,1);break;
  case"tr":return tr();
  case"make":{const id=uid(),ps=V.pairs.filter(p=>p[0].trim()&&p[1].trim());
    S.courses.push({id,title:V.title||"Мой курс",g:GR[S.courses.length%4],per:V.per,done:[],lang:V.clang||"английский",lcust:V.clc?1:0});
    S.words.push(...ps.map((p,i)=>({id:uid(),c:id,l:Math.floor(i/V.per),t:p[0].trim(),tr:p[1].trim(),st:0,due:0})));
    save();V={v:"course",id};break}
  case"course":V={v:"course",id:d.id};break;
  case"lesson":V={v:"lesson",id:V.id,i:+d.i};break;
  case"lstart":return start(S.words.filter(w=>w.c==V.id&&w.l==V.i),true,{c:V.id,l:V.i});
  case"lsay":{const w=S.words.find(x=>x.id==d.id);return w&&speak(w.v||w.t,wl(w))}
  case"crep":{const now=Date.now(),L=S.words.filter(w=>w.c==V.id&&w.st>0).sort((a,b)=>a.due-b.due);
    if(!L.length)return toast("Сначала пройдите хотя бы один урок");
    const dueW=L.filter(w=>w.due<=now);let ws=dueW.slice(0,20);
    if(ws.length<10)ws=L.slice(0,10);
    if(!dueW.length)toast("Повторение выученных слов (+1 ⭐ за слово)");
    return start(ws,false,{c:V.id,rev:1})}
  case"crai":{const c=S.courses.find(x=>x.id==V.id),W=S.words.filter(w=>w.c==c.id),L=W.filter(w=>w.st>0).sort((a,b)=>a.due-b.due),kw=(L.length?L:W).slice(0,8).map(w=>w.t);
    if(!kw.length)return toast("В курсе нет слов");
    S.rl=cl(c);save();V={v:"chat",sc:"Повторение слов",msgs:[],kw,used:new Set,busy:0,back:c.id};R();turn();return}
  case"delc":if(!V.cf){V.cf=1;break}S.words=S.words.filter(w=>w.c!=V.id);S.courses=S.courses.filter(c=>c.id!=V.id);save();V={v:"home"};break;
  case"review":return start(due().sort((a,b)=>a.due-b.due).slice(0,10),false,{rev:1});
  case"flip":V.flip=!V.flip;break;
  case"undo":undo();break;
  case"find":V={v:"find"};FD.rows=null;FD.err="";return findGo();
  case"fgo":return findGo();
  case"fadd":return findAdd(d.id);
  case"pubon":return pubSet(S.courses.find(x=>x.id==V.id),true).then(R);
  case"puboff":return pubSet(S.courses.find(x=>x.id==V.id),false).then(R);
  case"mode":S.mode=d.k;save();break;
  case"yes":case"no":{const n=Date.now();if(n-(T.lt||0)<350)return;T.lt=n;return grade(a=="yes",1)}
  case"say":{const w=T.q[T.i];return w&&speak(w.v||w.t,wl(w))}
  case"pick":if(V.ans!=null)return;V.ans=d.o;return grade(d.o==T.q[T.i].tr);
  case"check":{if(V.ans!=null)return;const v=$("#ty").value.trim();if(!v)return toast("Введите ответ");V.ans=v;return grade(matchAns(v,T.q[T.i]))}
  case"next":V.ans=null;V.flip=false;T.i++;if(T.i>=T.q.length)finish();break;
  case"stg":V.sheet=1;break;
  case"shut":V.sheet=0;break;
  case"ex":{const w=T.q[T.i];w.ex=null;return ld(w)}
  case"exn":{const w=T.q[T.i];if(!w||V.ld)return;w.xs=(w.xs||0)+1;w.px=(w.ex||[]).map(e=>e.s);w.ex=null;return ld(w)}
  case"wt":return wt(el,d.x);
  case"sayw":return speak(d.x);
  case"topic":V={v:"read",topic:d.k,txt:null,tt:{},all:0};gen();break;
  case"tsent":V.tt[d.i]=!V.tt[d.i];break;
  case"tall":V.all=!V.all;break;
  case"ssent":return speak(V.txt.s[+d.i].s);
  case"chat":V={v:"chat",sc:d.k,msgs:[],kw:kwList(),used:new Set,busy:0};R();turn();return;
  case"snd":return snd();
  case"set":V={v:"set"};break;
  case"xpinfo":V={v:"xp"};break;
  case"savenick":{
    const inp=$("#nickin")||document.querySelector('[data-f="nick"]');
    if(inp)S.nick=inp.value.trim().slice(0,24);
    save();
    if(!S.nick)return toast("Введите никнейм");
    toast("Никнейм «"+S.nick+"» сохранён!");
    if(V.v=="board")return loadBoard();
    break;
  }
  case"cl":{const c=S.courses.find(x=>x.id==V.id);c.lang=d.k;c.lcust=1;delete LC[c.id];save();break}
  case"goal":S.goal=+d.k;save();break;
  case"editc":{const c=S.courses.find(x=>x.id==V.id);if(!c||!isOwn(c))return toast("Изменять курс может только его автор");
    const ws=S.words.filter(w=>w.c==c.id).sort((a,b)=>a.l-b.l).map(w=>({id:w.id,t:w.t,tr:w.tr}));
    V={v:"editc",id:c.id,title:c.title,per:c.per,clang:cl(c),clc:1,ws,el:0};break}
  case"eadd":V.ws.push({t:"",tr:""});V.el=Math.floor((V.ws.length-1)/V.per);break;
  case"edel":V.ws.splice(+d.i,1);V.el=Math.min(V.el,Math.max(0,Math.ceil(V.ws.length/V.per)-1));break;
  case"esave":{const c=S.courses.find(x=>x.id==V.id);if(!c||!isOwn(c))return toast("Изменять курс может только его автор");
    const ps=V.ws.filter(x=>x.t.trim()&&x.tr.trim()),per=V.per;if(!ps.length)return toast("В курсе должно остаться хотя бы одно слово");
    const old=new Map(S.words.filter(w=>w.c==c.id).map(w=>[w.id,w]));S.words=S.words.filter(w=>w.c!=c.id);
    ps.forEach((x,i)=>{const t=x.t.trim(),r=x.tr.trim(),o=x.id&&old.get(x.id),l=Math.floor(i/per);
      if(o){if(o.t!=t){delete o.ex;delete o.v}Object.assign(o,{l,t,tr:r});S.words.push(o)}else S.words.push({id:uid(),c:c.id,l,t,tr:r,st:0,due:0})});
    const nl=Math.ceil(ps.length/per);Object.assign(c,{title:V.title.trim()||c.title,per,lang:V.clang,lcust:1,done:c.done.filter(i=>i<nl)});delete LC[c.id];
    save();toast("Курс сохранён");if(c.pub&&c.pid)pubSet(c,true);V={v:"course",id:c.id};break}
  case"setth":S.theme=d.k;save();th();break;
  case"sethk":S.hk=d.k=="1";save();break;
  case"setwd":S.wd=d.k;save();break;
  case"aitest":return testAI();
  case"vocal":return vocalAll();
  case"rep":V={v:"rep"};break;
  case"lang":S.rl=d.k;save();Object.assign(SBN,{cid:"all",items:null,err:"",busy:0,tk:SBN.tk+1});break;
  case"clang":V.clang=d.k;V.clc=1;break;
  case"rpl":REP.l=d.k;break;
  case"bdl":BRD.l=d.k;loadBoard();return;
  case"board":V={v:"board"};loadBoard();break;
  case"bdref":loadBoard();return;
  case"bcid":SBN.cid=d.k;return boxBuild();
  case"bnew":return boxBuild();
  case"bre":SBN.fill={};SBN.sel=null;SBN.chk=0;SBN.sh=null;break;
  case"bchk":{const v=SBN,bad=v.items.map((_,j)=>j).filter(j=>nz(v.items[v.fill[j]].ans)!=nz(v.items[j].ans));v.chk=1;v.sh=bad.length?{t:"err",l:bad,n:0}:null;break}
  case"bwin":SBN.sh={t:"win",j:+d.i};break;
  case"bsx":SBN.sh=null;break;
  case"bsn":SBN.sh.n=(SBN.sh.n+1)%SBN.sh.l.length;break;
  case"bai":return boxAI();
  case"bpick":{const v=SBN,n=v.items.findIndex((_,j)=>v.fill[j]==null),j=v.sel!=null&&v.fill[v.sel]==null?v.sel:n;if(j<0)return;v.fill[j]=+d.i;v.sel=null;v.chk=0;break}
  case"bblank":{const v=SBN,j=+d.i;if(v.fill[j]!=null)delete v.fill[j];else v.sel=j;v.chk=0;break}
  case"syn":V={v:"sync"};break;
  case"sbgen":{SB=SB||{};const a=new Uint8Array(12);crypto.getRandomValues(a);SB.code=[...a].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,20);break}
  case"sbok":return connect();
  case"agoogle":return googleIn();
  case"nlater":S.nl=1;save();break;
  case"ain":return signIn();
  case"aup":return signUp();
  case"aout":{const t=SB.session&&SB.session.at;SB.session=null;sbSave();if(t)ax("logout",{},t).catch(()=>{});ss="";break}
  case"sbpush":S.updated=Date.now();return push();
  case"sbpull":{const u=S.updated;S.updated=0;return pull().then(c=>{if(!c)S.updated=u;R()})}
  case"sboff":SB=null;try{localStorage.removeItem("wf_sb")}catch(e){}ss="";break;
  case"mtr":V.msgs[+d.i].sh=!V.msgs[+d.i].sh;return RC();
  case"msay":return speak(V.msgs[+d.i].s);
  }
  R();
}
const FD={q:"",rows:null,busy:0,err:""};
async function pbReq(path,o){o=o||{};const tk=SB&&SB.session?await authTok():null;
  const r=await fetch(base()+"/rest/v1/"+path,{method:o.m||"GET",body:o.b,headers:Object.assign({apikey:SB.key,Authorization:"Bearer "+(tk||SB.key),"Content-Type":"application/json"},o.h||{})});
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}throw new Error(/wf_pub|relation|schema cache/.test(m)||r.status==404?"Таблица курсов ещё не создана в Supabase (нужно выполнить SQL)":(m||"Ошибка "+r.status))}
  return r.status==204?null:r.json()}
async function findGo(){FD.busy=1;FD.err="";R();try{const q=FD.q.trim().replace(/[*,()%]/g,"");
  FD.rows=await pbReq("wf_pub?select=id,title,lang,cnt,author&is_public=eq.true&order=updated.desc&limit=30"+(q?"&or="+encodeURIComponent(`(title.ilike.*${q}*,author.ilike.*${q}*)`):""))}catch(e){FD.err=String(e.message||e)}FD.busy=0;R()}
async function findAdd(id){if(S.courses.some(c=>c.from==id))return toast("Этот курс уже добавлен");FD.busy=1;R();
  try{const p=(await pbReq("wf_pub?select=title,lang,per,words&id=eq."+id))[0];if(!p)throw new Error("Курс не найден");const cid=uid(),per=p.per||10;
    S.courses.push({id:cid,title:p.title,g:GR[S.courses.length%4],per,done:[],lang:p.lang||"английский",lcust:1,from:id});
    S.words.push(...p.words.map((x,i)=>({id:uid(),c:cid,l:Math.floor(i/per),t:x[0],tr:x[1],st:0,due:0})));save();FD.busy=0;V={v:"course",id:cid};R()}
  catch(e){FD.busy=0;FD.err=String(e.message||e);R()}}
async function pubSet(c,on){if(!(SB&&SB.session))return toast("Войдите в аккаунт, чтобы публиковать курсы");
  try{const ws=S.words.filter(w=>w.c==c.id).map(w=>[w.t,w.tr]),row={title:c.title,lang:cl(c),per:c.per,words:ws,cnt:ws.length,author:S.nick||(SB.session.email||"").split("@")[0]||"user",is_public:on,updated:Date.now()};
    if(c.pid)await pbReq("wf_pub?id=eq."+c.pid,{m:"PATCH",b:JSON.stringify(row)});
    else{row.owner=SB.session.id;c.pid=(await pbReq("wf_pub",{m:"POST",b:JSON.stringify(row),h:{Prefer:"return=representation"}}))[0].id}
    c.pub=on?1:0;save();toast(on?"Курс опубликован":"Курс стал приватным")}catch(e){toast(String(e.message||e))}}
const PUBCARD=c=>`<div class="card g col"><b>Доступ к курсу</b><p class="mu">${c.pub?"Опубликован: другие пользователи могут найти и добавить его.":"Приватный: виден только вам."}</p>${SB&&SB.session?`<div class="row">${c.pub?`<button class="btn sec" data-a="pubon">Обновить</button><button class="btn sec" data-a="puboff">Сделать приватным</button>`:`<button class="btn" data-a="pubon">Опубликовать</button>`}</div>`:`<button class="btn sec" data-a="syn">Войти, чтобы публиковать</button>`}</div>`;
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!e.target.closest("#pop,.wd"))$("#pop").className="";if(t)act(t.dataset.a,t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(f=="nick"){S.nick=t.value;save();return}if(f=="fq"){FD.q=t.value;return}if(!f||f=="draft")return;if(f=="aik"){try{localStorage.setItem("wf_ai",t.value.trim())}catch(e){}GM="";return}if(f=="aem"||f=="apw"){AU[f=="aem"?"em":"pw"]=f=="aem"?t.value.trim():t.value;return}if(f=="sbu"||f=="sbk"||f=="sbc"){SB=SB||{};SB[{sbu:"url",sbk:"key",sbc:"code"}[f]]=t.value.trim();return}if(f=="rl"||f=="lv"){S[f]=t.value;save();return}
  if(f=="title")V.title=t.value;else if(f=="per"){V.per=+t.value;if(V.v=="editc"){V.el=0;R()}}else if(f=="lang")V.lang=t.value;else if(f=="el"){V.el=+t.value;R()}else if(f=="ea"||f=="eb")V.ws[+t.dataset.i][f=="ea"?"t":"tr"]=t.value;else V.pairs[+t.dataset.i][f=="a"?0:1]=t.value});
document.addEventListener("change",e=>{if(e.target.type=="file")load(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;if(e.target.id=="ty")act("check",{});else if(e.target.id=="cin")snd();else if(e.target.dataset.f=="nick")act("savenick",{});else if(e.target.dataset.f=="fq")act("fgo",{})});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(V.v=="import")load(e.dataTransfer.files[0])});
authBoot();th();R();if(sbOn())pull().then(c=>{if(c){th();R()}});

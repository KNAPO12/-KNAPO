function parse(txt){
  const ok=[],bad=[],seen=new Set;
  const SEP=[/\t/,/\s*;\s*/,/\s+[—–-]+\s+|\s*[—–]\s*/,/\s*\|\s*/,/\s*=\s*/,/:\s+/,/\s*,\s*/,/$/];
  txt.replace(/^\uFEFF/,"").split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim().replace(/^\d+[.)]\s+/,"").replace(/^[•*]\s+/,"");
    if(!l)return;
    let a,b;const q=l.match(/^"([^"]*)"\s*[,;]\s*"?([^"]*?)"?$/);
    if(q){a=q[1].trim();b=q[2].trim()}
    else{const s=SEP.map(r=>l.match(r)).find(Boolean);a=l.slice(0,s.index).trim();b=l.slice(s.index+s[0].length).trim()}
    if(!a||(!b&&l.length>60)){bad.push([i+1,raw,"не распознано"]);return}
    if(!ok.length&&!seen.size&&/^(word|term|слово|english|original|en)$/i.test(a)){seen.add("#h");return}
    const k=a.toLowerCase();
    if(seen.has(k)){bad.push([i+1,raw,"дубликат"]);return}
    seen.add(k);ok.push([a,b]);
  });
  return{ok,bad};
}

    b=`<div class="big ${back?"":"hs"}" ${back?"":'dir="auto"'}><div>${shown}</div><small>${back?"напишите слово на языке оригинала":"напишите перевод"}</small>${back?"":snd}</div><input class="in" id="ty" dir="auto" autocomplete="off" autocapitalize="off" placeholder="${back?"Слово на языке оригинала":"Перевод"}" ${a?"disabled":""} value="${esc(V.ans||"")}">`+(a?`<div class="fb ${r?"ok":"bad"}"><span class="fi">${ic(r?"check":"close",16)}</span><span>${r?"Верно!":"Правильно: "+exp}</span></div><button class="btn" data-a="next">Дальше</button>`:`<button class="btn" data-a="check">Проверить</button>`)}
  return`<div class="top"><i class="bar pill g"><u style="width:${p}%"></u><em>${T.done.size} / ${T.words.length} слов · ${p}%</em></i><button class="cnt g" data-a="stg" aria-label="Прогресс повторений">${w.st}</button></div>${b}<div class="row">${[["quiz","list","Выбор"],["type","pen","Письмо"],["card","cards","Карточка"]].map(([k,i,n])=>`<button class="chip ${k==m?"on":""}" ${a?"disabled":""} data-a="mode" data-k="${k}">${ic(i,18)}${n}</button>`).join("")}</div>${exb(w)}${V.sheet?sheet(w):""}`},
read:()=>{const x=V.txt;return`<h2>${esc(V.topic)}</h2>`+(!x?`<div class="empty">${ic("spark",44)}<p>Пишу текст по теме…</p></div>`:`<div class="big" dir="auto" style="font-size:22px">${tok(x.title)}<small>${esc(x.titleT)}</small></div>`+x.s.map((e,i)=>`<div class="exi"><p dir="auto">${tok(e.s)}</p>${V.all||V.tt[i]?`<p class="mu">↳ ${esc(e.t)}</p>`:""}<div class="row"><button class="x" data-a="tsent" data-i="${i}" aria-label="Перевод">${ic("lang",20)}</button><button class="x" data-a="ssent" data-i="${i}" aria-label="Озвучить">${ic("vol",20)}</button></div></div>`).join("")+`<div class="row"><button class="btn sec" data-a="tall">${V.all?"Скрыть перевод":"Весь перевод"}</button><button class="btn" data-a="topic" data-k="${esc(V.topic)}">${ic("refresh",20)} Новый текст</button></div>`)},
chat:()=>`<h2>${esc(V.sc)}</h2><div class="kw" id="kw">${kwh()}</div><div id="msgs">${msgs()}</div><div class="comp g"><input class="in" id="cin" data-f="draft" placeholder="Напишите ответ…" autocomplete="off" autocapitalize="off"><button class="send" data-a="snd" aria-label="Отправить">${ic("send",20)}</button></div>`,
sync:()=>{const s=SB||{},A=s.session;return`<h2>Синхронизация</h2>${OWN?`<p class="mu">Войдите через Google или email: прогресс сохранится в аккаунте и будет одинаковым на всех ваших устройствах.</p>`:`<p class="mu">Подключите бесплатный проект Supabase, и прогресс станет общим на всех устройствах. Project URL и ключ вводятся один раз на каждом устройстве.</p><input class="in" data-f="sbu" value="${esc(s.url||"")}" placeholder="Project URL (https://xxxx.supabase.co)" autocapitalize="off" autocomplete="off"><input class="in" data-f="sbk" value="${esc(s.key||"")}" placeholder="anon public key" autocapitalize="off" autocomplete="off">`}`+
(A?`<div class="card g col"><b>Вы вошли</b><p>${esc(A.email||"аккаунт")}</p><div class="row"><button class="btn sec" data-a="sbpush">Отправить</button><button class="btn sec" data-a="sbpull">Получить</button></div><button class="btn sec" data-a="aout">Выйти</button></div>`:`<div class="card g col"><b>Аккаунт</b><button class="btn" data-a="agoogle"><b style="font-size:18px">G</b> Войти через Google</button><input class="in" data-f="aem" type="email" value="${esc(AU.em)}" placeholder="Email" autocapitalize="off" autocomplete="email"><input class="in" data-f="apw" type="password" value="${esc(AU.pw)}" placeholder="Пароль (от 6 символов)" autocomplete="current-password"><div class="row"><button class="btn sec" data-a="ain">Войти</button><button class="btn sec" data-a="aup">Регистрация</button></div></div>`)+
`<p class="mu" id="sst">${esc(ss||(sbOn()?"Подключено":"Не подключено"))}</p>`+
(A?"":`<details><summary>Синхронизация по коду (без аккаунта)</summary><input class="in" data-f="sbc" value="${esc(s.code||"")}" placeholder="Код синхронизации (не короче 12 символов)" autocapitalize="off" autocomplete="off" style="margin:8px 0"><button class="btn sec" data-a="sbgen">Создать новый код</button><button class="btn" data-a="sbok" style="margin-top:8px">Подключить по коду</button>${sbOn()?`<div class="row" style="margin-top:8px"><button class="btn sec" data-a="sbpush">Отправить</button><button class="btn sec" data-a="sbpull">Получить</button></div><button class="btn sec" data-a="sboff" style="margin-top:8px">Отключить</button>`:""}</details>`)+
(OWN?"":`<details><summary>SQL для Supabase (выполнить один раз)</summary><pre>${esc(SQL+ASQL)}</pre></details>`)},
set:()=>{const tm=S.theme||"",hk=S.hk!==false,wd=S.wd=="back",ch=(a,k,on,t)=>`<button class="chip ${on?"on":""}" data-a="${a}" data-k="${k}">${t}</button>`;
  return`<h2>Настройки</h2><div class="card g col"><b>Тема</b><div class="row">${ch("setth","",tm=="","Авто")}${ch("setth","light",tm=="light","Светлая")}${ch("setth","dark",tm=="dark","Тёмная")}</div></div><div class="card g col"><b>ИИ: примеры, чтение, диалог, песочница</b><p class="mu">Нужен бесплатный ключ Google Gemini (aistudio.google.com/apikey). При ошибке 503 приложение автоматически переключится на встроенные шаблоны.</p><input class="in" type="password" data-f="aik" value="${esc(AIK())}" placeholder="Ключ Gemini (AIza…)" autocapitalize="off" autocomplete="off"><button class="btn" data-a="aitest">Проверить ключ</button><p class="mu" id="ais">${esc(AIS||(aiOn()?"ИИ подключён":"Включён авто-режим без ИИ"))}</p></div><div class="card g col"><b>Арабский: огласовка (харакаты)</b><div class="row">${ch("sethk","1",hk,"Показывать")}${ch("sethk","0",!hk,"Скрывать")}</div><button class="btn sec" data-a="vocal">Добавить огласовку словам (ИИ)</button><p class="mu">Если в файле слова без харакатов, ИИ расставит их. Важные слова лучше проверять: ИИ может ошибаться.</p></div><div class="card g col"><b>Режим «Письмо»</b><div class="row">${ch("setwd","fwd",!wd,"Слово → перевод")}${ch("setwd","back",wd,"Перевод → слово")}</div></div><div class="card g col"><b>Баланс очков (XP): ${S.xp}</b><p class="mu">Если после старой системы у вас накопилось слишком много звёздочек, вы можете пропорционально уменьшить их.</p><button class="btn sec" data-a="fixxp">Пересчитать старые очки (÷4)</button></div><button class="btn sec" data-a="xpinfo">Как работают очки и серия</button>`},
xp:()=>`<h2>Как работают очки</h2><div class="card g col"><b>Очки (XP)</b><p>Очки копятся за занятия и нужны для рейтинга и недельного отчёта.</p><p class="mu">• Верный ответ в тренировке: от 1 до 5 очков. Чем больше верных ответов подряд, тем выше награда.<br>• В «Диалоге ИИ»: +1 за каждое слово из списка, которое вы использовали.<br>• В «Песочнице»: +2 за ответ со статусом «Успех».<br>• Ошибка очки не отнимает, но обрывает серию верных ответов.</p></div><div class="card g col"><b>Серия (огонёк)</b><p>Это число дней подряд, в которые вы завершили хотя бы одну тренировку. Пропустили день, серия начнётся заново.</p></div><div class="card g col"><b>Число в кружке на тренировке</b><p>Этап повторений текущего слова от 0 до 7. Чем выше этап, тем реже слово появляется. После 7-го этапа оно считается выученным. Нажмите на кружок, чтобы увидеть интервалы.</p></div><div class="card g col"><b>Рейтинг и отчёт</b><p>Считают очки за последние 7 дней отдельно по каждому языку.</p></div>`,
done:()=>`<div class="empty">${ic(V.pass?"star":"refresh",48)}<h2>${V.sc}%</h2><p>${V.pass?"Тренировка пройдена!":"Нужно не меньше 80%. Попробуйте ещё раз."}</p><p class="mu">+${T.xp} XP · серия ${S.streak} дн.</p><p class="mu">Освоение слов: ${pct(T.words)}% · до конца ${100-pct(T.words)}%${T.key?` · курс ${prog(S.courses.find(x=>x.id==T.key.c))}%`:""}</p></div><button class="btn" data-a="${T.key?"course":"home"}" data-id="${T.key?T.key.c:""}">Продолжить</button>`
};
let lastKey="";
function R(){
  const y=scrollY,key=V.v+(V.id||"")+(V.topic||"")+(V.sc||"")+(S.tab||"")+(V.v=="run"?T.i:"");
  $("#app").innerHTML=head()+`<main class="${V.v=="home"||V.v=="chat"||V.v=="course"?"pb":""}">`+views[V.v]()+"</main>"+(V.v=="home"?tabs():"");
  const t=$("#ty");if(t&&!t.disabled)t.focus({preventScroll:true});
  $("#pop").className="";
  if(V.v=="chat")scrollTo(0,document.body.scrollHeight);else scrollTo(0,key==lastKey?y:0);
  lastKey=key;
}
function act(a,d,el){
  switch(a){
  case"home":V={v:"home"};T=0;break;
  case"theme":S.theme=S.theme==""?"dark":S.theme=="dark"?"light":"";save();th();break;
  case"tab":S.tab=d.k;save();break;
  case"import":V={v:"import"};break;
  case"sample":$("#paste").value=EX;return;
  case"parse":{const t=$("#paste").value;if(!t.trim())return toast("Вставьте список или выберите файл");return go(t,"Мой курс")}
  case"swap":V.pairs=V.pairs.map(p=>[p[1],p[0]]);break;
  case"del":V.pairs.splice(+d.i,1);break;
  case"tr":return tr();
  case"make":{const id=uid(),ps=V.pairs.filter(p=>p[0].trim()&&p[1].trim());
    S.courses.push({id,title:V.title||"Мой курс",g:GR[S.courses.length%4],per:V.per,done:[],lang:V.clang||"английский",lcust:V.clc?1:0});
    S.words.push(...ps.map((p,i)=>({id:uid(),c:id,l:Math.floor(i/V.per),t:p[0].trim(),tr:p[1].trim(),st:0,due:0})));
    save();V={v:"course",id};break}
  case"course":V={v:"course",id:d.id};break;
  case"lesson":return start(S.words.filter(w=>w.c==V.id&&w.l==+d.i),true,{c:V.id,l:+d.i});
  case"crep":{const now=Date.now(),L=S.words.filter(w=>w.c==V.id&&w.st>0).sort((a,b)=>a.due-b.due);
    if(!L.length)return toast("Сначала пройдите хотя бы один урок");
    const dueW=L.filter(w=>w.due<=now);let ws=dueW.slice(0,20);
    if(ws.length<10)ws=L.slice(0,10);
    if(!dueW.length)toast("Пока нет слов к повторению — тренировка досрочно");
    return start(ws,false,{c:V.id,rev:1})}
  case"crai":{const c=S.courses.find(x=>x.id==V.id),W=S.words.filter(w=>w.c==c.id),L=W.filter(w=>w.st>0).sort((a,b)=>a.due-b.due),kw=(L.length?L:W).slice(0,8).map(w=>w.t);
    if(!kw.length)return toast("В курсе нет слов");
    S.rl=cl(c);save();V={v:"chat",sc:"Повторение слов",msgs:[],kw,used:new Set,busy:0,back:c.id};R();turn();return}
  case"delc":if(!V.cf){V.cf=1;break}S.words=S.words.filter(w=>w.c!=V.id);S.courses=S.courses.filter(c=>c.id!=V.id);save();V={v:"home"};break;
  case"review":return start(due().sort((a,b)=>a.due-b.due).slice(0,10),false,null);
  case"flip":V.flip=!V.flip;break;
  case"mode":S.mode=d.k;save();break;
  case"yes":case"no":{const n=Date.now();if(n-(T.lt||0)<350)return;T.lt=n;return grade(a=="yes",1)}
  case"say":return speak(T.q[T.i].v||T.q[T.i].t);
  case"pick":if(V.ans!=null)return;V.ans=d.o;return grade(d.o==T.q[T.i].tr);
  case"check":{if(V.ans!=null)return;const v=$("#ty").value.trim();if(!v)return toast("Введите ответ");V.ans=v;return grade(matchAns(v,T.q[T.i]))}
  case"next":V.ans=null;V.flip=false;T.i++;if(T.i>=T.q.length)finish();break;
  case"stg":V.sheet=1;break;
  case"shut":V.sheet=0;break;
  case"ex":{const w=T.q[T.i];w.ex=null;return ld(w)}
  case"wt":return wt(el,d.x);
  case"sayw":return speak(d.x);
  case"topic":V={v:"read",topic:d.k,txt:null,tt:{},all:0};gen();break;
  case"tsent":V.tt[d.i]=!V.tt[d.i];break;
  case"tall":V.all=!V.all;break;
  case"ssent":return speak(V.txt.s[+d.i].s);
  case"chat":V={v:"chat",sc:d.k,msgs:[],kw:kwList(),used:new Set,busy:0};R();turn();return;
  case"snd":return snd();
  case"set":V={v:"set"};break;
  case"xpinfo":V={v:"xp"};break;
  case"fixxp":{S.xp=Math.round((S.xp||0)/4);Object.values(S.hist||{}).forEach(h=>{if(h.xp)h.xp=Math.round(h.xp/4);Object.values(h.l||{}).forEach(g=>{if(g.xp)g.xp=Math.round(g.xp/4)})});save();toast("Очки пересчитаны!");break}
  case"cl":{const c=S.courses.find(x=>x.id==V.id);c.lang=d.k;c.lcust=1;delete LC[c.id];save();break}
  case"setth":S.theme=d.k;save();th();break;
  case"sethk":S.hk=d.k=="1";save();break;
  case"setwd":S.wd=d.k;save();break;
  case"aitest":return testAI();
  case"vocal":return vocalAll();
  case"rep":V={v:"rep"};break;
  case"lang":S.rl=d.k;save();SBX.w=null;SBX.sit=null;SBX.prev=[];SBX.n=0;SBX.rev=null;SBX.busy=0;SBX.tk++;break;
  case"clang":V.clang=d.k;V.clc=1;break;
  case"rpl":REP.l=d.k;break;
  case"bdl":BRD.l=d.k;loadBoard();return;
  case"board":V={v:"board"};loadBoard();break;
  case"bdref":loadBoard();return;
  case"bsit":return genSit();
  case"bw":SBX.w=pickWord();SBX.prev=[];SBX.n=0;return genSit();
  case"bh":SBX.hint=!SBX.hint;break;
  case"bchk":if(!SBX.ans.trim())return toast("Сначала напишите ответ");return chk();
  case"syn":V={v:"sync"};break;
  case"sbgen":{SB=SB||{};const a=new Uint8Array(12);crypto.getRandomValues(a);SB.code=[...a].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,20);break}
  case"sbok":return connect();
  case"agoogle":return googleIn();
  case"nlater":S.nl=1;save();break;
  case"ain":return signIn();
  case"aup":return signUp();
  case"aout":{const t=SB.session&&SB.session.at;SB.session=null;sbSave();if(t)ax("logout",{},t).catch(()=>{});ss="";break}
  case"sbpush":S.updated=Date.now();return push();
  case"sbpull":{const u=S.updated;S.updated=0;return pull().then(c=>{if(!c)S.updated=u;R()})}
  case"sboff":SB=null;try{localStorage.removeItem("wf_sb")}catch(e){}ss="";break;
  case"mtr":V.msgs[+d.i].sh=!V.msgs[+d.i].sh;return RC();
  case"msay":return speak(V.msgs[+d.i].s);
  }
  R();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!e.target.closest("#pop,.wd"))$("#pop").className="";if(t)act(t.dataset.a,t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(f=="nick"){S.nick=t.value;save();return}if(!f||f=="draft")return;if(f=="aik"){try{localStorage.setItem("wf_ai",t.value.trim())}catch(e){}GM="";return}if(f=="aem"||f=="apw"){AU[f=="aem"?"em":"pw"]=f=="aem"?t.value.trim():t.value;return}if(f=="bans"){SBX.ans=t.value;return}if(f=="bl"){S.bl=t.value;save();genSit();return}if(f=="sbu"||f=="sbk"||f=="sbc"){SB=SB||{};SB[{sbu:"url",sbk:"key",sbc:"code"}[f]]=t.value.trim();return}if(f=="rl"||f=="lv"){S[f]=t.value;save();return}
  if(f=="title")V.title=t.value;else if(f=="per")V.per=+t.value;else if(f=="lang")V.lang=t.value;else V.pairs[+t.dataset.i][f=="a"?0:1]=t.value});
document.addEventListener("change",e=>{if(e.target.type=="file")load(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;if(e.target.id=="ty")act("check",{});else if(e.target.id=="cin")snd()});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(V.v=="import")load(e.dataTransfer.files[0])});
authBoot();th();R();if(sbOn())pull().then(c=>{if(c){th();R()}});
</script>
</body>

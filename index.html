/* ===== Бесплатный переводчик MyMemory API (работает без ключей) ===== */
async function myMem(q,src="en",dst="ru"){
  const clean=strip(String(q)).trim();
  if(!clean)return"";
  const sCode=AR.test(clean)?"ar":(LCODE[src]||src||"en"),dCode=LCODE[dst]||dst||"ru";
  if(sCode==dCode)return"";
  const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${sCode}|${dCode}`);
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  let tr=((j&&j.responseData&&j.responseData.translatedText)||"").trim();
  if(!tr||/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(tr))throw new Error("limit");
  return tr.replace(/^["«]|["».]$/g,"");
}

function parse(txt){
  const ok=[],bad=[],seen=new Set;
  const SEP=[/\t/,/\s*;\s*/,/\s+[—–-]+\s+|\s*[—–]\s*/,/\s*\|\s*/,/\s*=\s*/,/:\s+/,/\s*,\s*/,/$/];
  txt.replace(/^\uFEFF/,"").split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim().replace(/^\d+[.)]\s+/,"").replace(/^[•*]\s+/,"");
    if(!l)return;
    let a,b;const q=l.match(/^"([^"]*)"\s*[,;]\s*"?([^"]*?)"?$/);
    if(q){a=q[1].trim();b=q[2].trim()}
    else{const s=SEP.map(r=>l.match(r)).find(Boolean);a=l.slice(0,s.index).trim();b=l.slice(s.index+s[0].length).trim()}
    if(!a||(!b&&l.length>60)){bad.push([i+1,raw,"не распознано"]);return}
    if(!ok.length&&!seen.size&&/^(word|term|слово|english|original|en)$/i.test(a)){seen.add("#h");return}
    const k=a.toLowerCase();
    if(seen.has(k)){bad.push([i+1,raw,"дубликат"]);return}
    seen.add(k);ok.push([a,b]);
  });
  return{ok,bad};
}

  case"bh":SBX.hint=!SBX.hint;break;
